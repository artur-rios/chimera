name: chimera_gui
description: Flutter web and desktop adapter for Chimera utilities.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  chimera_core:
    path: ../../packages/chimera_core
  chimera_l10n:
    path: ../../packages/chimera_l10n
  chimera_platform:
    path: ../../packages/chimera_platform
  chimera_utilities:
    path: ../../packages/chimera_utilities
  cross_file: ^0.3.5+2
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true
