name: chimera_gui
description: Flutter web and desktop adapter for Chimera utilities.
publish_to: none
version: 0.1.3+4
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  chimera_core:
    path: ../../packages/chimera_core
  chimera_l10n:
    path: ../../packages/chimera_l10n
  chimera_platform:
    path: ../../packages/chimera_platform
  chimera_utilities:
    path: ../../packages/chimera_utilities
  cross_file: ^0.3.5+5
  file_picker: ^13.3.3
  file_picker_web: 4.2.1
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  logging: ^1.3.0
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - fonts/OFL.txt
    - fonts/README.md
  fonts:
    - family: Noto Color Emoji
      fonts:
        - asset: fonts/Noto-COLRv1.ttf
