name: Minimal .NET library scaffold

# Every branch the mirror pushes: Jenkins copies these results onto the Forgejo pull request by its head
# commit, and pull requests exist only on Forgejo.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-library:
    # The Windows leg of the old ubuntu/windows matrix, under the name GitHub reported for it (the catalog's
    # actionsCheck); the Linux leg is a Jenkins check now (yggdrasil.yml).
    name: Minimal library contracts (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: flutter pub get
      - name: Verify pinned goldens, safety, rollback, and real Debug/Release builds
        run: dart test packages/chimera_utilities/test/dotnet_minimal_repository_test.dart packages/chimera_core/test/minimal_library_scaffold_service_test.dart packages/chimera_platform/test/minimal_library_scaffold_test.dart apps/chimera_cli/test/functional/dotnet_init_min_test.dart
