name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package
        required: true
        type: string
      publish:
        description: Upload to and publish a prepared draft release
        required: true
        default: false
        type: boolean
      release_id:
        description: Draft release ID (required when publish is true)
        required: false
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before packaging
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require an unpublished draft release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$release")" = true
          test "$(jq -r .prerelease <<<"$release")" = false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze and test release source
        run: |
          flutter pub get
          version="${RELEASE_TAG#v}"
          dart tool/validate_release_readiness.dart --version "$version"
          dart format --output=none --set-exit-if-changed apps packages test tests tool
          dart analyze --fatal-infos
          dart run melos run test:unit
          dart test test tests/deployment tests/update tests/performance

  package-windows:
    name: Package Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build native applications
        shell: pwsh
        run: |
          flutter pub get
          $version = $env:RELEASE_TAG.TrimStart('v')
          Push-Location apps/chimera_gui
          flutter build windows --release `
            --build-name=$version `
            --dart-define="CHIMERA_RELEASE_REPOSITORY=$env:GITHUB_REPOSITORY"
          Pop-Location
          New-Item -ItemType Directory -Force build/cli/windows | Out-Null
          dart compile exe apps/chimera_cli/bin/chimera.dart `
            --define="CHIMERA_VERSION=$version" `
            --define="CHIMERA_RELEASE_REPOSITORY=$env:GITHUB_REPOSITORY" `
            -o build/cli/windows/chimera.exe
      - name: Install installer compiler
        run: choco install innosetup --no-progress --yes
      - name: Package applications and write integrity sidecars
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          & ./tool/package_windows.ps1 `
            -Version $version `
            -GuiInputDirectory apps/chimera_gui/build/windows/x64/runner/Release `
            -CliExecutable build/cli/windows/chimera.exe `
            -OutputDirectory dist/windows
          dart run tool/write_checksums.dart dist/windows --version $version --repository $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@v6
        with:
          name: chimera-windows-packages
          path: |
            dist/windows/*
            dist/windows/*.sha256
            dist/windows/*.release.json
          if-no-files-found: error

  package-linux:
    name: Package Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux packaging prerequisites
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build native applications
        run: |
          flutter pub get
          version="${RELEASE_TAG#v}"
          cd apps/chimera_gui
          flutter build linux --release \
            --build-name="$version" \
            --dart-define="CHIMERA_RELEASE_REPOSITORY=$GITHUB_REPOSITORY"
          cd ../..
          mkdir -p build/cli/linux
          dart compile exe apps/chimera_cli/bin/chimera.dart \
            --define="CHIMERA_VERSION=$version" \
            --define="CHIMERA_RELEASE_REPOSITORY=$GITHUB_REPOSITORY" \
            -o build/cli/linux/chimera
      - name: Package applications and write integrity sidecars
        run: |
          version="${RELEASE_TAG#v}"
          sh tool/package_linux.sh \
            --version "$version" \
            --gui-dir apps/chimera_gui/build/linux/x64/release/bundle \
            --cli build/cli/linux/chimera \
            --output dist/linux
          dart run tool/write_checksums.dart dist/linux --version "$version" --repository "$GITHUB_REPOSITORY"
      - name: Smoke-test installed Linux packages
        run: |
          sudo dpkg --install dist/linux/chimera-cli-linux-*-installer.deb
          sudo dpkg --install dist/linux/chimera-gui-linux-*-installer.deb
          chimera --help
          set +e
          xvfb-run -a timeout 5s chimera-gui
          status=$?
          set -e
          test "$status" -eq 124
      - uses: actions/upload-artifact@v6
        with:
          name: chimera-linux-packages
          path: |
            dist/linux/*
            dist/linux/*.sha256
            dist/linux/*.release.json
          if-no-files-found: error

  validate-artifacts:
    name: Validate complete native bundle
    needs: [package-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve validator dependencies
        run: flutter pub get
      - uses: actions/download-artifact@v7
        with:
          pattern: chimera-*-packages
          path: dist
          merge-multiple: true
      - name: Validate artifacts, checksums, and release metadata
        run: |
          version="${RELEASE_TAG#v}"
          dart run tool/validate_release_bundle.dart dist \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY"

  publish:
    name: Attach native artifacts
    permissions:
      contents: write
    if: inputs.publish
    needs: validate-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve publisher validation dependencies
        run: flutter pub get
      - uses: actions/download-artifact@v7
        with:
          pattern: chimera-*-packages
          path: dist
          merge-multiple: true
      - name: Revalidate the immutable publication bundle
        run: |
          version="${RELEASE_TAG#v}"
          dart run tool/validate_release_bundle.dart dist \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY"
      - name: Upload and verify the private draft bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = true
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            > release-assets.json
          dart run tool/validate_release_upload.dart dist release-assets.json
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = true
          test "$(gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --jq .draft)" = false
