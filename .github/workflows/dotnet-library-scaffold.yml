name: NuGet Library Scaffold Acceptance

# Every branch the mirror pushes: Jenkins copies these results onto the Forgejo pull request by its head
# commit, and pull requests exist only on Forgejo.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-library:
    # The Windows leg of the old ubuntu/windows matrix, under the name GitHub reported for it (the catalog's
    # actionsCheck); the Linux leg is a Jenkins check now (yggdrasil.yml).
    name: Generated NuGet library (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Resolve workspace
        run: flutter pub get
      - name: Verify parameter, template and transaction contracts
        run: dart test packages/chimera_utilities/test/dotnet_repository_test.dart packages/chimera_core/test/dotnet_library_scaffold_service_test.dart packages/chimera_platform/test/dotnet_library_scaffold_test.dart
      - name: Restore, build, test and pack generated repository
        run: dart run tool/verify_dotnet_library.dart
