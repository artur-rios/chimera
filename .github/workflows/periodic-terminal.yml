name: Windows periodic terminal

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-contract:
    name: Windows owned terminal lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart test packages/chimera_core/test/type_periodic_service_test.dart packages/chimera_platform/test/type_periodic_terminal_test.dart packages/chimera_platform/test/type_periodic_windows_test.dart apps/chimera_cli/test/functional/type_periodic_test.dart
