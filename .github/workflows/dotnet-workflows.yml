name: Native .NET workflows

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-contract:
    name: .NET build and process lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: flutter pub get
      - name: Verify shared builds, discovery, diagnostics, and cancellation
        run: dart test packages/chimera_core/test/dotnet_build_test.dart packages/chimera_platform/test/native_commands_test.dart packages/chimera_platform/test/dotnet_build_integration_test.dart apps/chimera_cli/test/functional/dotnet_build_test.dart
