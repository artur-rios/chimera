name: Native .NET workflows

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-contract:
    name: .NET build, coverage and process lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install isolated ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 --tool-path .dotnet-test-tools --allow-roll-forward
      - name: Add isolated tool directory to PATH
        shell: pwsh
        run: '"${{ github.workspace }}/.dotnet-test-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: flutter pub get
      - name: Verify shared builds, discovery, diagnostics, and cancellation
        run: dart test packages/chimera_core/test/dotnet_build_test.dart packages/chimera_platform/test/native_commands_test.dart packages/chimera_platform/test/dotnet_build_integration_test.dart apps/chimera_cli/test/functional/dotnet_build_test.dart packages/chimera_core/test/dotnet_test_test.dart packages/chimera_platform/test/dotnet_test_workspace_test.dart packages/chimera_platform/test/dotnet_test_integration_test.dart apps/chimera_cli/test/functional/dotnet_test_test.dart
