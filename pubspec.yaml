name: chimera_workspace
description: Workspace tooling for the Chimera monorepo.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

workspace:
  - apps/chimera_cli
  - apps/chimera_gui
  - packages/chimera_core
  - packages/chimera_l10n
  - packages/chimera_platform
  - packages/chimera_utilities

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.9.0
  test: ^1.26.0
  yaml: ^3.1.3


