name: chimera_workspace
description: Workspace tooling for the Chimera monorepo.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

workspace:
  - apps/chimera_cli
  - apps/chimera_gui
  - packages/chimera_core
  - packages/chimera_l10n
  - packages/chimera_platform
  - packages/chimera_utilities

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.9.0
  test: ^1.26.0
  yaml: ^3.1.3

melos:
  command:
    bootstrap:
      runPubGetInParallel: false
  scripts:
    analyze:
      description: Analyze every application, package, and repository test.
      run: dart run melos exec -- "dart analyze --fatal-infos"
    test:unit:
      description: Run Dart package and CLI unit tests.
      run: dart run melos exec --no-flutter --dir-exists=test -- "dart test"
    test:cli:
      description: Run CLI functional tests.
      run: dart run melos exec --scope=chimera_cli --dir-exists=test -- "dart test"
    test:gui:
      description: Run Flutter widget and integration tests.
      run: dart run tool/run_gui_tests.dart
    test:web:
      description: Run repository web contract tests.
      run: dart test tests/web
    test:deployment:
      description: Run deployment and update contract tests.
      run: dart test tests/deployment tests/update
    test:all:
      description: Run every Chimera test suite.
      run: dart run melos run test:unit && dart run melos run test:cli && dart run melos run test:gui && dart run melos run test:web && dart run melos run test:deployment


